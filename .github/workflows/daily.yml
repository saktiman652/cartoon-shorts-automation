
name: Daily Cartoon Content Brief

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read

jobs:
  generate-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install video tools and Hindi font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Generate daily brief
        run: python generate.py

      - name: Create cartoon MP4
        run: python make_video.py

      - name: Save brief and video as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-cartoon-output
          path: output/
          if-no-files-found: error
          retention-days: 7
          
      - name: Upload video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib
          python - <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          creds = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"]
          )

          youtube = build("youtube", "v3", credentials=creds)

          video_path = "output/cartoon-video.mp4"

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": "Daily Cartoon Shorts",
                      "description": "Animated cartoon short video.",
                      "categoryId": "22"
                  },
                  "status": {
                      "privacyStatus": "private"
                  }
              },
              media_body=MediaFileUpload(
                  video_path,
                  mimetype="video/mp4",
                  resumable=True
              )
          )

          result = request.execute()
          print("YouTube upload successful. Video ID:", result["id"])
          print("Video link: https://www.youtube.com/watch?v=" + result["id"])
          PY
          
