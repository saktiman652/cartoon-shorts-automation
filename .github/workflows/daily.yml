name: Daily Cartoon Content Brief

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'

permissions:
  contents: read

jobs:
  generate-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install video tools and Hindi font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Generate daily brief
        run: python generate.py

      - name: Create cartoon MP4
        run: python make_video.py

      - name: Save brief and video as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-cartoon-output
          path: |
            output/daily-brief.md
            output/cartoon-video.mp4
          if-no-files-found: error
          retention-days: 7
          
