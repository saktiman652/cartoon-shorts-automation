
name: Daily Cartoon Content Brief

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  generate-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate daily brief
        run: python generate.py

      - name: Save brief as artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-cartoon-brief
          path: output/daily-brief.md
          retention-days: 7
          
